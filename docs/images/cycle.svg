<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d">
  <title id="t">The verification cycle</title>
  <desc id="d">A task is proposed by an agent, accepted, dispatched to a harness, completed with typed evidence, and judged by a different agent. A failed verdict sends it back to in progress with the reason.</desc>

  <!-- The diagram carries its own background, so it controls its own contrast in
       GitHub's light and dark themes instead of depending on which one is set. -->
  <rect width="1200" height="430" fill="#120F0C"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C3BCB7"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F67F2F"/>
    </marker>
    <style>
      .h  { font: 600 15px "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; fill: #EDE6E1; }
      .who{ font: 500 12.5px ui-monospace, "Geist Mono", Consolas, monospace; fill: #9D9792; letter-spacing: .02em; }
      .st { font: 600 16.5px ui-monospace, "Geist Mono", Consolas, monospace; fill: #EDE6E1; }
      .n  { font: 400 13.5px "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; fill: #C3BCB7; }
      .em { font: 600 13.5px "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; fill: #F67F2F; }
      .k  { font: 400 12px ui-monospace, Consolas, monospace; fill: #9D9792; }
    </style>
  </defs>

  <!-- ===== WHO acts at each step. It goes on top because that is the question the
           reader arrives with: not «what states exist» but «who moves this» ===== -->
  <text class="who" x="96"  y="72" text-anchor="middle">an agent</text>
  <text class="who" x="324" y="72" text-anchor="middle">the owner</text>
  <text class="who" x="552" y="72" text-anchor="middle">a harness</text>
  <text class="who" x="780" y="72" text-anchor="middle">the agent</text>
  <text class="who" x="1030" y="72" text-anchor="middle">a DIFFERENT agent</text>

  <!-- ===== The cycle. These are the engine's own state names, verbatim ===== -->
  <g>
    <rect x="16"  y="92" width="160" height="52" rx="4" fill="#28231F" stroke="#342F2C"/>
    <text class="st" x="96"  y="125" text-anchor="middle">proposed</text>

    <rect x="244" y="92" width="160" height="52" rx="4" fill="#28231F" stroke="#342F2C"/>
    <text class="st" x="324" y="125" text-anchor="middle">accepted</text>

    <rect x="472" y="92" width="160" height="52" rx="4" fill="#28231F" stroke="#342F2C"/>
    <text class="st" x="552" y="125" text-anchor="middle">in_progress</text>

    <rect x="700" y="92" width="160" height="52" rx="4" fill="#28231F" stroke="#342F2C"/>
    <text class="st" x="780" y="125" text-anchor="middle">done</text>

    <!-- the last one carries the only colour in the diagram: that is where the point is -->
    <rect x="950" y="92" width="160" height="52" rx="4" fill="#44250C" stroke="#F67F2F" stroke-width="1.5"/>
    <text class="st" x="1030" y="125" text-anchor="middle" fill="#EDE6E1">verified</text>
  </g>

  <line x1="184" y1="118" x2="236" y2="118" stroke="#C3BCB7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="412" y1="118" x2="464" y2="118" stroke="#C3BCB7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="640" y1="118" x2="692" y2="118" stroke="#C3BCB7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="868" y1="118" x2="942" y2="118" stroke="#C3BCB7" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- what travels along each arrow. Without this the diagram is a row of boxes -->
  <text class="k" x="210" y="108" text-anchor="middle">claim</text>
  <text class="k" x="438" y="108" text-anchor="middle">dispatch</text>
  <text class="k" x="666" y="108" text-anchor="middle">run</text>
  <text class="k" x="905" y="108" text-anchor="middle">verdict</text>

  <!-- ===== THE RETURN PATH. This is the line that proves the judgement is real: if
           there were only a way forward, «verified» would be a stamp, not an exam ===== -->
  <path d="M 1030 152 L 1030 196 L 552 196 L 552 152"
        fill="none" stroke="#F67F2F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text class="em" x="791" y="216" text-anchor="middle">fail → back to in_progress, with the reason written down</text>

  <!-- ===== The trust boundary — the part the interface cannot show ===== -->
  <line x1="16" y1="266" x2="1184" y2="266" stroke="#342F2C"/>

  <!-- The text lives in ONE <text> with <tspan>, not in separate lines with x values
       guessed by eye: the first version positioned each fragment by hand and the
       gaps wandered. Positions are measured or allowed to flow — never estimated. -->
  <text class="h" x="16" y="302">What the judge is not allowed to do</text>

  <text class="n" x="16" y="332">
    <tspan>The evidence the agent hands in is wrapped as </tspan><tspan class="em">untrusted data</tspan><tspan>: the verifier is told to judge it,</tspan>
    <tspan x="16" dy="23">not to obey it. An agent cannot mark its own work as verified, and it cannot talk its way past the</tspan>
    <tspan x="16" dy="23">check — the judge runs with no tools and a schema that only accepts </tspan><tspan class="k">{verdict, reason}</tspan><tspan>.</tspan>
  </text>

  <text class="n" x="16" y="412">Agents run headless, in an isolated working directory, with no identity and no persistent session.</text>
</svg>
