# CI of the public FarOS repo. It lives in AgenticOS and travels with the export
# (docs/whitelist_pub.md), so the next export never overwrites it.
# FarOS is a Windows app (the installer is for Windows), so the judge runs on Windows.
# Linux and macOS are planned separately (#1360).
name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                # pyproject.toml promises >=3.11; 3.14 is what runs at home.
                python: ["3.11", "3.14"]
        name: check (python ${{ matrix.python }})
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python }}

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - id: install
              run: python -m pip install -e ".[dev]"

            # A run cut short can still exit 0 (it happened in EcoRelay for five months):
            # require pytest's summary and at least MIN_TESTS passed tests.
            # Removing tests on purpose? Lower MIN_TESTS in the same PR.
            # 1089 run by default (judge and stress are out); the calendar tests skip
            # themselves near midnight (4 of them), and CI runs in UTC: hence the margin.
            - name: Python tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              shell: bash
              env:
                  MIN_TESTS: 1080
              run: |
                  set +e
                  python -m pytest -q -p no:cacheprovider tests 2>&1 | tee pytest-output.txt
                  status=${PIPESTATUS[0]}
                  passed=$(grep -oE '[0-9]+ passed' pytest-output.txt | tail -1 | grep -oE '[0-9]+')
                  passed=${passed:-0}
                  echo "tests passed: $passed (minimum $MIN_TESTS), pytest exit code: $status"
                  if [ "$passed" -lt "$MIN_TESTS" ]; then
                      echo "::error::only $passed tests passed (expected at least $MIN_TESTS): the run was cut short or tests were lost"
                      exit 1
                  fi
                  exit "$status"

            - name: App tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              working-directory: app
              run: node --test

    # #1361: lint y formato del Python. No dependen del sistema, así que van en Linux y no esperan a Windows.
    # La versión de ruff y sus reglas viven en pyproject.toml ([dev] y [tool.ruff]): aquí no se repiten.
    lint:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.14"
            - name: Install ruff and vulture (the exact versions in pyproject.toml)
              shell: bash
              run: |
                  pins=$(grep -oE '"(ruff|vulture)==[0-9.]+"' pyproject.toml | tr -d '"')
                  echo "installing $pins"
                  python -m pip install $pins
            - name: ruff check
              run: ruff check faros tests tools
            - name: ruff format --check
              if: ${{ !cancelled() }}
              run: ruff format --check faros tests tools
            # Dead code in faros/ (what gets installed). vulture also reads tests/ and tools/ so that
            # something only they use does not count as dead, but only faros/ makes it fail.
            # The routes and MCP tools are called through their decorator; vulture_whitelist.py holds
            # the checked false positives, each with its reason.
            - name: vulture (dead code in faros/)
              if: ${{ !cancelled() }}
              shell: bash
              # vulture exits 0 (clean) or 3 (found something). Anything else (not installed, crash) is
              # an error: without this check a missing vulture printed nothing for faros/ and passed green.
              run: |
                  set +e
                  vulture faros tests tools vulture_whitelist.py --min-confidence 60 \
                      --ignore-decorators "@app.*,@mcp.tool,@pytest.*" > vulture.txt 2>&1
                  status=$?
                  if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
                      cat vulture.txt
                      echo "::error::vulture did not run (exit code $status)"
                      exit 1
                  fi
                  dead=$(grep -E '^faros' vulture.txt)
                  if [ -n "$dead" ]; then
                      echo "$dead"
                      echo "::error::dead code in faros/ (or a new false positive: add it to vulture_whitelist.py with its reason)"
                      exit 1
                  fi
                  echo "no dead code in faros/"
            # The app: eslint and prettier, at the exact versions in app/package.json (package-lock.json).
            # --ignore-scripts: no Electron binary download, the checks do not need it.
            - uses: actions/setup-node@v4
              if: ${{ !cancelled() }}
              with:
                  node-version: "24"
            - name: Install the app's dev tools
              id: npm
              if: ${{ !cancelled() }}
              working-directory: app
              run: npm ci --ignore-scripts --no-audit --no-fund
            - name: eslint (app)
              if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
              working-directory: app
              run: npm run lint
            - name: prettier --check (app)
              if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
              working-directory: app
              run: npm run format:check

    secrets:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: gitleaks (whole history)
              run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source /repo --no-banner --redact
