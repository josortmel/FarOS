# CI of the public FarOS repo. It lives in AgenticOS and travels with the export
# (docs/whitelist_pub.md), so the next export never overwrites it.
# FarOS is a Windows app (the installer is for Windows), so the judge runs on Windows.
# Linux and macOS are planned separately (#1360).
name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                # pyproject.toml promises >=3.11; 3.14 is what runs at home.
                python: ["3.11", "3.14"]
        name: check (python ${{ matrix.python }})
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python }}

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - id: install
              run: python -m pip install -e ".[dev]"

            # A run cut short can still exit 0 (it happened in EcoRelay for five months):
            # require pytest's summary and at least MIN_TESTS passed tests.
            # Removing tests on purpose? Lower MIN_TESTS in the same PR.
            - name: Python tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              shell: bash
              env:
                  MIN_TESTS: 1090
              run: |
                  set +e
                  python -m pytest -q -p no:cacheprovider tests 2>&1 | tee pytest-output.txt
                  status=${PIPESTATUS[0]}
                  passed=$(grep -oE '[0-9]+ passed' pytest-output.txt | tail -1 | grep -oE '[0-9]+')
                  passed=${passed:-0}
                  echo "tests passed: $passed (minimum $MIN_TESTS), pytest exit code: $status"
                  if [ "$passed" -lt "$MIN_TESTS" ]; then
                      echo "::error::only $passed tests passed (expected at least $MIN_TESTS): the run was cut short or tests were lost"
                      exit 1
                  fi
                  exit "$status"

            - name: App tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              working-directory: app
              run: node --test

    secrets:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: gitleaks (whole history)
              run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source /repo --no-banner --redact
